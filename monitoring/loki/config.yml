auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # At info, Loki logged each periodic index-table upload: about 500,000 lines a day,
  # 1.44 GB of container log by 26 November 2026, also shipped back into Loki by Promtail.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: false

# retention_period has no effect unless the compactor applies it. Without this block every
# chunk since April 2026 was kept (183,000 files on 26 November 2026, 179,000 past 7 days).
# The 24 h delete delay keeps the sweeper's unthrottled unlinks from landing before a paced
# cleanup of that backlog; production's rotating disk gates launches at 5 % I/O pressure.
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 24h
  retention_delete_worker_count: 1

ruler:
  alertmanager_url: http://localhost:9093
