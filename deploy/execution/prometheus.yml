global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/execution-alerts.yml
scrape_configs:
  - job_name: webkinpred-execution
    metrics_path: /internal/v2/metrics
    authorization:
      type: Bearer
      credentials_file: /run/execution/metrics-token
    static_configs:
      - targets: [backend:8000]
